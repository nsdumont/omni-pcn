[project]
name = "pcn"
version = "0.1.0"
description = "Predictive Coding Nets - A JAX-based package for defining, simulating, and training predictive coding networks and graphs"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "EUPL-1.2"}
authors = [
    {name = "Nicole Dumont"}
]
keywords = ["predictive-coding", "neural-networks", "jax", "jax-mps", "machine-learning", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "jax==0.9.2",
    "jaxlib==0.9.2",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm",
    "h5py>=3.0.0",
    "equinox>=0.13.4",
    "optax==0.2.5",
]

[tool.uv]
default-groups = ["dev", "plot"]


[project.urls]
Homepage = "https://github.com/nsdumont/omnipcn"
Documentation = "https://github.com/nsdumont/omnipcn"
Repository = "https://github.com/nsdumont/omnipcn"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pcn"]

[dependency-groups]
plot = [
  "matplotlib>=3.6.3",
  "plotly",
  "scikit-learn",
  "seaborn",
  "pygame"
]
# Mac w/ Apple Silicon
mps = [
    "jax-mps==0.9.13; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# CUDA support
cuda = [
    "jax[cuda12]==0.9.2",
]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "ipykernel>=7.2.0",
    "datasets",
]

[tool.pytest.ini_options]
testpaths = ["pcn/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM"]
ignore = ["D100", "D104", "D107", "D203", "D213"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
